name: Part 3 invariants
on:
  pull_request:
    paths:
      - 'part3.py'
      - 'part3_controls.py'
      - 'tests/test_part3.py'
      - '.github/workflows/part3.yml'
  push:
    branches:
      - 'sol/part3-two-clocks-controlled'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_part3.py' -v
      - run: python part3.py --seeds 2 --stream 400 --ntest 200 --out results/part3-smoke.json
